name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - run: shellcheck install.sh run-kolibri.sh tools/check-package.sh tools/kolibri-smoke.sh
      - run: bash tools/check-package.sh
      - name: Test pinned eugr integration
        run: |
          git clone --no-checkout https://github.com/eugr/spark-vllm-docker.git /tmp/eugr
          git -C /tmp/eugr checkout bb6ee761643f45eb84b14f7e39c41d7538d53890
          bash install.sh /tmp/eugr
          /tmp/eugr/run-kolibri.sh --dry-run --1m | grep -q -- '--max-model-len 1048576'
