recipe_version: "1"
name: Kolibri-1-FP8-Solo
description: Aleph Alpha Kolibri-1 FP8 at 262K context on one DGX Spark (experimental)
model: Aleph-Alpha/Kolibri-1
container: vllm-node-kolibri1-029
solo_only: true
cluster_only: false
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.82
  max_model_len: 262144
  max_num_seqs: 1
  max_num_batched_tokens: 4096
command: |
  vllm serve Aleph-Alpha/Kolibri-1 \
    --host {host} --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype fp8 \
    --enable-chunked-prefill \
    --enforce-eager \
    --reasoning-parser kolibri1 \
    --tool-call-parser kolibri1 \
    --enable-auto-tool-choice
